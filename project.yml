# XcodeGen manifest. The .xcodeproj is *generated* from this file and is
# gitignored -- so project structure lives in reviewable YAML instead of a
# merge-hostile pbxproj blob. Regenerate after adding files:
#
#     cd SooshViewerApple && xcodegen generate
#
name: SooshViewer

options:
  bundleIdPrefix: com.soosh
  createIntermediateGroups: true
  # iOS/tvOS 26 so Liquid Glass (`glassEffect`, `GlassEffectContainer`,
  # `.buttonStyle(.glass)`) is available unconditionally. This deliberately
  # drops every device below 26 — a personal-server app can make that trade;
  # anything shipping broadly would want availability checks instead.
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode. Data-race safety is checked at compile time, which
    # is why the client is an `actor` and the view model is `@MainActor`.
    SWIFT_STRICT_CONCURRENCY: complete
    # DEVELOPMENT_TEAM is deliberately *not* set here.
    #
    # A build setting written in this manifest outranks the same key in an
    # xcconfig, so declaring it here — even as "" — would shadow whatever
    # Config/Local.xcconfig supplies. An empty team is worse than no team: it
    # tells automatic signing to sign with nothing, which is why Xcode reported
    # "your team has no devices" rather than asking for a team.
    #
    # Set DEVELOPMENT_TEAM in Config/Local.xcconfig instead. It is gitignored, so
    # a Team ID stays machine-local rather than being committed.
    CODE_SIGN_STYLE: Automatic
    # Placeholders. Config/Local.xcconfig overrides these and is gitignored --
    # see Config/Local.xcconfig.example.
    DISPATCHARR_URL: ""
    DISPATCHARR_USER: ""
    DISPATCHARR_PASS: ""

# Both targets compile the same Sources/ tree. Platform differences are handled
# in Swift with #if os(tvOS), not by forking the file list.
targetTemplates:
  App:
    type: application
    sources:
      - path: Sources
        # Sources/Shaders is excluded on purpose, and temporarily.
        #
        # Two reasons, both about Shaders.metal rather than about shaders:
        # it does not compile yet (`solidColor` has no return expression), and
        # building any .metal file needs a Metal toolchain that is a separate
        # download on Xcode 26 (`xcodebuild -downloadComponent MetalToolchain`).
        # With the file in the target, *every* build fails at CompileMetalFile —
        # including builds that have nothing to do with it.
        #
        # Delete this exclude once the shader compiles and the toolchain is
        # installed. Nothing in Swift references it yet.
      
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: Soosh
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Xcode expands $(FOO) inside Info.plist values from build settings, so
        # the xcconfig above is what actually supplies these at build time.
        INFOPLIST_KEY_DISPATCHARR_URL: $(DISPATCHARR_URL)

targets:
  Soosh-iOS:
    templates: [App]
    platform: iOS
    scheme:
      testTargets:
        - SooshTests
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Soosh
        # The live path now serves HLS from 127.0.0.1 over plain HTTP, and App
        # Transport Security blocks cleartext by default. `NSAllowsLocalNetworking`
        # is the documented exemption for loopback and local-network loads; it
        # relaxes nothing about the Dispatcharr connection itself, which stays
        # HTTPS and stays subject to ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        # Required for Picture in Picture and for audio to survive
        # backgrounding. Without it PiP starts and immediately stops.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DISPATCHARR_URL: $(DISPATCHARR_URL)
        DISPATCHARR_USER: $(DISPATCHARR_USER)
        DISPATCHARR_PASS: $(DISPATCHARR_PASS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soosh.viewer
        # **Mac Catalyst is on, and the way it got here was deleting a
        # dependency rather than fixing one.**
        #
        # It is what gives the app a real resizable Mac window; without it the
        # only macOS destination is "Designed for iPad", a fixed-size window that
        # ignores `.defaultSize` outright — which is why setting it in
        # `SooshViewerApp` appeared to do nothing.
        #
        # Catalyst was blocked three times, once per FFmpeg engine, and **not one
        # of the three was blocked by our code.** All three were binary
        # packaging:
        #
        # - KSPlayer 2.3.4 declared `.macCatalyst(.v13)` while its own FFmpegKit
        #   required `.v14`, so the pair would not build for Catalyst at all.
        # - MPVKit 1.0.0 shipped a real `ios-arm64_x86_64-maccatalyst` slice and
        #   *compiled and linked*, then failed at the embed step on all ~25
        #   binary frameworks: iOS-style shallow bundles where Catalyst wants the
        #   macOS versioned layout.
        # - AetherEngine 6.27.1 shipped no Catalyst slice at all, and so failed
        #   earliest of the three — at slice selection, before compiling.
        #
        # The engines were there to demux MPEG-TS. They did not need to be:
        # AVFoundation decodes MPEG-TS natively **as HLS segments** — it is HLS's
        # original container — and these channels are ordinary H.264 High +
        # AAC-LC. What it cannot consume is an endless, unindexed TS body, which
        # is a framing problem, not a codec one. `Sources/Playback/TransportStream`
        # solves the framing in ~600 lines of Foundation and Network, so there is
        # no xcframework left to have a Catalyst slice or not have one.
        #
        # That also retired the tvOS-simulator `EXCLUDED_ARCHS` workaround (a
        # missing LibDovi x86_64 slice) and several GB of binaries.
        SUPPORTS_MACCATALYST: YES
        # Catalyst gets its own bundle id derived from the iOS one, rather than
        # sharing it.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        # Deployment target for the Catalyst variant. Matched to iOS 26 for the
        # same reason: Liquid Glass unconditionally.
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  # A **native AppKit Mac app**, kept alongside the Catalyst variant.
  #
  # This target exists because Catalyst was blocked three times, once per FFmpeg
  # engine, and a native Mac app was the only route left to a Mac window. That
  # is no longer true — the ledger on `SUPPORTS_MACCATALYST` above explains why
  # Catalyst now builds — so **the two overlap, and one of them is redundant.**
  # Deliberately left standing rather than deleted in the same change that
  # turned Catalyst on: it compiles the same `Sources/` tree and costs nothing
  # to keep until the Catalyst build has been exercised on real hardware.
  #
  # `deploymentTarget` is set per-target here rather than in `options` at the top
  # of the file, which only declares iOS and tvOS. macOS 26 for the same reason
  # as the others: Liquid Glass unconditionally.
  Soosh-macOS:
    templates: [App]
    platform: macOS
    deploymentTarget: "26.0"
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: Soosh
        # The live path now serves HLS from 127.0.0.1 over plain HTTP, and App
        # Transport Security blocks cleartext by default. `NSAllowsLocalNetworking`
        # is the documented exemption for loopback and local-network loads; it
        # relaxes nothing about the Dispatcharr connection itself, which stays
        # HTTPS and stays subject to ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A real Mac app, not a menu-bar accessory.
        LSApplicationCategoryType: public.app-category.entertainment
        DISPATCHARR_URL: $(DISPATCHARR_URL)
        DISPATCHARR_USER: $(DISPATCHARR_USER)
        DISPATCHARR_PASS: $(DISPATCHARR_PASS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soosh.viewer.mac
        # **The App Sandbox is deliberately off.**
        #
        # Turning it on needs `com.apple.security.network.client` or every
        # Dispatcharr request fails with a connection error that looks like a
        # server problem rather than an entitlement. It is one entitlements file
        # away and belongs with a real signing story — see the credentials note
        # in CLAUDE.md — rather than being switched on untested here.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  # Tests run on iOS only. The connect loop under test is platform-independent,
  # and a second test target would just double the run time.
  SooshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Soosh-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # xcodegen derives TEST_HOST from the *target* name, but PRODUCT_NAME is
        # "Soosh" — so the default path points at an app that does not exist.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Soosh.app/Soosh
        BUNDLE_LOADER: $(TEST_HOST)

  Soosh-tvOS:
    templates: [App]
    platform: tvOS
    info:
      path: Generated/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Soosh
        # The live path now serves HLS from 127.0.0.1 over plain HTTP, and App
        # Transport Security blocks cleartext by default. `NSAllowsLocalNetworking`
        # is the documented exemption for loopback and local-network loads; it
        # relaxes nothing about the Dispatcharr connection itself, which stays
        # HTTPS and stays subject to ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        DISPATCHARR_URL: $(DISPATCHARR_URL)
        DISPATCHARR_USER: $(DISPATCHARR_USER)
        DISPATCHARR_PASS: $(DISPATCHARR_PASS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soosh.viewer.tv
